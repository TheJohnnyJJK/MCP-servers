[project]
name = "mcp-redteam-scanner"
version = "0.1.0"
description = "MCP server that prompt-injection-tests any /qualify-shaped agent endpoint"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "mcp[cli]>=2.0",
  "httpx>=0.27",
  "pydantic[email]>=2.7",
]

[project.scripts]
mcp-redteam-scanner = "mcp_redteam_scanner.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_redteam_scanner"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "C4", "SIM", "PIE"]
ignore = ["S105", "S106"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
